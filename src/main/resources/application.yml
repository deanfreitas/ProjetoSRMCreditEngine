spring:
  application:
    name: srm-credit-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${DB_USERNAME:srm}
    password: ${DB_PASSWORD:srm}
    hikari:
      # Liquidacao e transacao curta; pool pequeno e explicito evita esconder contencao.
      maximum-pool-size: 10
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Timeouts curtos e obrigatorios: o guarda de idempotencia fica no caminho do
      # dinheiro, e Redis lento sem teto seria contencao adicionada por uma otimizacao.
      # Estourar o prazo nao falha a liquidacao - degrada para o caminho do PostgreSQL.
      timeout: 200ms
      connect-timeout: 200ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Sem notacao cientifica em BigDecimal. Nos DTOs da API os valores monetarios vao como
    # string, porque JSON number lido em JavaScript vira double e perde centavo.
    generator:
      write-bigdecimal-as-plain: true
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      # Erro de framework (405, 415, rota inexistente) tambem sai como problem+json,
      # no mesmo formato do ApiExceptionHandler.
      enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

credit-engine:
  pricing:
    # Decimais, nao percentuais: 0.01 = 1,00% a.m. (mesma premissa dos golden cases)
    base-monthly-rate: 0.01
    duplicata-monthly-spread: 0.015
    cheque-monthly-spread: 0.025
  idempotency:
    # Guarda em Redis na borda: reserva a Idempotency-Key antes de resolver cambio,
    # precificar e abrir transacao. Nao substitui uk_settlements_idempotency_key nem
    # uk_settlements_receivable - com ele desligado ou fora do ar, a decisao volta para
    # dentro da transacao e o sistema continua correto (DECISIONS.md, secao 5).
    enabled: ${CREDIT_ENGINE_IDEMPOTENCY_ENABLED:true}
    key-prefix: "srm:idempotency:settlement:"
    # Teto do prejuizo se o processo morrer entre reservar e commitar: por este prazo um
    # retry legitimo recebe SETTLEMENT_IN_PROGRESS. Precisa cobrir a pior liquidacao
    # plausivel (cotacao externa com timeout e retry) sem esgotar a paciencia do cliente.
    in-progress-ttl: 30s
    # Janela em que o retry de chave concluida e respondido sem refazer o trabalho caro.
    completed-ttl: 24h
  fx:
    # Cotacao mais velha que isso nao liquida: falha com 503 em vez de usar taxa defasada.
    max-staleness: 12h
    upstream:
      # Provedor externo mockado. Nasce desligado de proposito: mock que sobe sozinho
      # acaba precificando operacao real. O compose liga via
      # CREDIT_ENGINE_FX_UPSTREAM_ENABLED=true.
      enabled: ${CREDIT_ENGINE_FX_UPSTREAM_ENABLED:false}
      # Latencia e instabilidade simuladas: e o que torna timeout, retry e disjuntor
      # demonstraveis sem depender de rede real.
      latency: 80ms
      failure-rate: 0
      quote-currency: BRL
      source: MOCK_UPSTREAM
      rates:
        USD: 5.4321
    resilience:
      # Teto por tentativa. A liquidacao tem transacao aberta enquanto espera: provedor
      # lento sem timeout vira contencao no pool de conexoes.
      call-timeout: 800ms
      max-attempts: 3
      retry-backoff: 100ms
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 2
      max-concurrent-calls: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      # Coerente com o desenho: o guarda falha aberto, entao Redis fora do ar nao torna a
      # aplicacao insalubre - ela fica mais lenta. Marcar DOWN aqui tiraria o pod do
      # balanceador por causa de uma otimizacao, transformando idempotencia em causa de
      # indisponibilidade. O que observar e credit_engine.idempotency{result=unavailable}.
      enabled: false
