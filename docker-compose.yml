services:
  db:
    image: postgres:16-alpine
    container_name: srm-credit-engine-db
    environment:
      POSTGRES_DB: srm_credit_engine
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # A aplicacao so sobe quando o banco aceita conexao: sem isso o Flyway
      # falha na primeira tentativa e o container reinicia em loop.
      test: [ "CMD-SHELL", "pg_isready -U srm -d srm_credit_engine" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: srm-credit-engine-redis
    # appendonly ligado de proposito: o default do Redis perde escrita em queda, e a
    # reserva de idempotencia e justamente o dado cuja perda custa trabalho repetido.
    # Nao e o que garante a correcao (isso e o UNIQUE no PostgreSQL) - e o que evita
    # degradar a cada reinicio.
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: srm-credit-engine-app
    depends_on:
      db:
        condition: service_healthy
      # Espera o Redis apenas para a demonstracao comecar limpa. A aplicacao sobe e
      # liquida sem ele: o guarda de idempotencia falha aberto para o PostgreSQL.
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/srm_credit_engine
      DB_USERNAME: srm
      DB_PASSWORD: srm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Provedor externo de cotacao (mockado) ligado apenas neste ambiente de
      # demonstracao: e ele que permite ver timeout, retry e disjuntor em acao sem
      # precisar cadastrar cotacao na mao.
      CREDIT_ENGINE_FX_UPSTREAM_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  db-data:
  redis-data:
